[package]
name = "astro-processor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
log = "0.4.35"
nalgebra = "0.35.0"
rawler = "0.8.0"
rayon = "1.12.0"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiff = "0.11.3"

[profile.dev]
opt-level = 2

[profile.release]
debug = 1

[lints.clippy]
# Index loops over the three colour channels read better than iterator chains.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# `!(x > 0.0)` is used deliberately so that NaN takes the same branch as <= 0.
neg_cmp_op_on_partial_ord = "allow"
